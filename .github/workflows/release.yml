name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run unit tests
        run: node --test scripts/*.test.mjs
        env:
          CI: "true"
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}

      - name: License gate (belt-and-suspenders)
        run: node scripts/check-licenses.mjs

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create release tarball
        run: |
          git archive --format=tar.gz --prefix=claudebeat-${{ steps.version.outputs.VERSION }}/ \
            -o claudebeat-${{ steps.version.outputs.VERSION }}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: claudebeat v${{ steps.version.outputs.VERSION }}
          body: |
            ## claudebeat v${{ steps.version.outputs.VERSION }}

            A Claude Code plugin that plays a short audio cue when Claude needs your attention.

            ### Sounds included
            - **lofi/whisper** — Soft tape hiss, warm tone (default)
            - **lofi/lattice** — Single muted marimba note, slow decay
            - **lofi/halo** — Vinyl bell with a touch of crackle
            - **chiptune/pixel** — Crisp NES-style blip, two notes up

            ### Platform support
            - macOS: `afplay` (built-in, always present)
            - Linux: `paplay` (PulseAudio) → `aplay` (ALSA fallback)
            - Windows: PowerShell `SoundPlayer`

            See [README.md](README.md) for install instructions and customization.
          files: claudebeat-${{ steps.version.outputs.VERSION }}.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
